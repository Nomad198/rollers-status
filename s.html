<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Статус заказа — РоллерсЛайф Сервис</title>
<style>
  :root { --bg:#f3f5f7; --card:#fff; --text:#1d2733; --muted:#6b7785; --accent:#e67e22; --ok:#2e9e5b; --bad:#c0392b; --line:#e3e8ee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181d; --card:#1e242b; --text:#e8edf2; --muted:#93a0ad; --line:#2d3540; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width:520px; margin:0 auto; padding:16px; }
  .brand { text-align:center; font-weight:700; color:var(--accent); margin:12px 0 16px; letter-spacing:.3px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; }
  .num { color:var(--muted); font-size:14px; }
  h1 { margin:2px 0 14px; font-size:22px; }
  .badge { display:inline-block; padding:4px 12px; border-radius:999px; font-weight:600; font-size:14px; color:#fff; background:var(--accent); }
  .badge.done { background:var(--ok); } .badge.cancel { background:var(--bad); }
  .bar { height:12px; background:var(--line); border-radius:999px; overflow:hidden; margin:18px 0 6px; }
  .bar > i { display:block; height:100%; background:var(--accent); border-radius:999px; transition:width .4s; }
  .bar.done > i { background:var(--ok); }
  .pct { color:var(--muted); font-size:14px; }
  h2 { font-size:15px; margin:22px 0 8px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
  ul { list-style:none; margin:0; padding:0; }
  li { padding:9px 0; border-top:1px solid var(--line); display:flex; gap:10px; }
  li:first-child { border-top:0; }
  .mark { width:20px; flex:none; text-align:center; color:var(--muted); }
  li.done .mark { color:var(--ok); }
  .upd { text-align:center; color:var(--muted); font-size:13px; margin-top:14px; }
  .err { text-align:center; padding:30px 10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">РоллерсЛайф Сервис</div>
  <div id="app" class="card"><div class="err">Загрузка…</div></div>
  <div id="upd" class="upd"></div>
</div>
<script>
(async function () {
  const app = document.getElementById('app');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fail = msg => { app.innerHTML = '<div class="err">' + msg + '</div>'; };

  const token = new URLSearchParams(location.search).get('t');
  if (!token) return fail('Ссылка некорректна. Отсканируйте QR-код с квитанции ещё раз.');

  async function load() {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(token));
    const hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    const r = await fetch('data/' + hash + '.json?_=' + Date.now(), {cache: 'no-store'});
    if (r.status === 404) throw new Error('nf');
    if (!r.ok) throw new Error('http');
    return r.json();
  }

  function render(d) {
    const done = d.status === 'Выполнен', cancel = d.status === 'Отменён';
    const label = done ? 'Готов к выдаче' : cancel ? 'Отменён' : 'В работе';
    const items = (d.items || []).map(i =>
      '<li class="' + (i.done ? 'done' : '') + '"><span class="mark">' + (i.done ? '✓' : '○') + '</span><span>' + esc(i.name) + '</span></li>').join('');
    app.innerHTML =
      '<div class="num">Заказ №' + esc(d.number) + '</div>' +
      '<h1>' + esc(d.device || 'Устройство') + '</h1>' +
      '<span class="badge ' + (done ? 'done' : cancel ? 'cancel' : '') + '">' + label + '</span>' +
      '<div class="bar ' + (done ? 'done' : '') + '"><i style="width:' + (done ? 100 : Math.max(0, Math.min(100, d.percent || 0))) + '%"></i></div>' +
      '<div class="pct">Выполнено: ' + (done ? 100 : (d.percent || 0)) + '%</div>' +
      (items ? '<h2>Работы</h2><ul>' + items + '</ul>' : '');
    if (d.updated) {
      const t = new Date(d.updated);
      document.getElementById('upd').textContent = 'Обновлено: ' + t.toLocaleString('ru-RU', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
    }
  }

  async function tick(first) {
    try { render(await load()); }
    catch (e) {
      if (first) fail(e.message === 'nf'
        ? 'Информация о заказе пока не опубликована. Обновление занимает 1–3 минуты, попробуйте позже.'
        : 'Не удалось загрузить данные. Попробуйте позже.');
    }
  }
  await tick(true);
  setInterval(() => tick(false), 60000);
})();
</script>
</body>
</html>
